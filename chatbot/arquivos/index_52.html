<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot com API Python</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .chat-container {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
      overflow: hidden;
      border: 1px solid #e5e5e5;
    }

    .chat-header {
      background: #1f5fa6;
      color: white;
      padding: 16px 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .chat-subtitle {
      font-size: 13px;
      font-weight: normal;
      opacity: 0.9;
      margin-top: 4px;
    }

    .chat-box {
      height: 380px;
      overflow-y: auto;
      padding: 18px;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: #dbeafe;
      color: #0f172a;
    }

    .msg.bot {
      align-self: flex-start;
      background: #e8f5e9;
      color: #1b4332;
    }

    .msg.system {
      align-self: center;
      background: #fff7d6;
      color: #6b5b00;
      font-size: 14px;
      text-align: center;
      max-width: 95%;
    }

    .chat-input {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #e5e5e5;
      background: #fff;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #cfcfcf;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .chat-input input:focus {
      border-color: #1f5fa6;
    }

    .chat-input button {
      border: none;
      background: #1f5fa6;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .chat-input button:hover {
      background: #17497f;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      Chatbot de Suporte
      <div class="chat-subtitle">Conectado à API Python local</div>
    </div>

    <div class="chat-box" id="chat-box">
      <div class="msg system">Digite uma mensagem. O front-end envia para a API em <strong>http://127.0.0.1:8000/chat</strong>.</div>
    </div>

    <div class="chat-input">
      <input type="text" id="mensagem" placeholder="Digite sua mensagem...">
      <button onclick="enviarMensagem()">Enviar</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const input = document.getElementById("mensagem");

    function adicionarMensagem(texto, tipo) {
      const div = document.createElement("div");
      div.className = `msg ${tipo}`;
      div.textContent = texto;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function enviarMensagem() {
      const texto = input.value.trim();

      if (!texto) {
        return;
      }

      adicionarMensagem(texto, "user");
      input.value = "";

      try {
        const resposta = await fetch("http://127.0.0.1:8000/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ texto: texto })
        });

        const dados = await resposta.json();
        adicionarMensagem(dados.resposta || "Sem resposta da API.", "bot");
      } catch (erro) {
        adicionarMensagem("Erro ao conectar com a API. Verifique se o servidor Python está rodando.", "bot");
      }
    }

    input.addEventListener("keypress", function(evento) {
      if (evento.key === "Enter") {
        enviarMensagem();
      }
    });
  </script>
</body>
</html>
