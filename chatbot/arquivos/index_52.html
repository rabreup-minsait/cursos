<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot com API Python</title>
  
<link rel="stylesheet" href="../style.css">
</head>
<body class="page-arquivos-index-52">
  <div class="chat-container">
    <div class="chat-header">
      Chatbot de Suporte
      <div class="chat-subtitle">Conectado à API Python local</div>
    </div>

    <div class="chat-box" id="chat-box">
      <div class="msg system">Digite uma mensagem. O front-end envia para a API em <strong>http://127.0.0.1:8000/chat</strong>.</div>
    </div>

    <div class="chat-input">
      <input type="text" id="mensagem" placeholder="Digite sua mensagem...">
      <button onclick="enviarMensagem()">Enviar</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const input = document.getElementById("mensagem");

    function adicionarMensagem(texto, tipo) {
      const div = document.createElement("div");
      div.className = `msg ${tipo}`;
      div.textContent = texto;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function enviarMensagem() {
      const texto = input.value.trim();

      if (!texto) {
        return;
      }

      adicionarMensagem(texto, "user");
      input.value = "";

      try {
        const resposta = await fetch("http://127.0.0.1:8000/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ texto: texto })
        });

        const dados = await resposta.json();
        adicionarMensagem(dados.resposta || "Sem resposta da API.", "bot");
      } catch (erro) {
        adicionarMensagem("Erro ao conectar com a API. Verifique se o servidor Python está rodando.", "bot");
      }
    }

    input.addEventListener("keypress", function(evento) {
      if (evento.key === "Enter") {
        enviarMensagem();
      }
    });
  </script>
</body>
</html>
