<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat da Livraria Aurora do Exercício 071</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {--bg:#f8f7f5;--surface:#ffffff;--border:#e2ddd8;--text:#1e1916;--text2:#3d3630;--text3:#7a726a;--accent:#1f5fa6;--accent-lt:#e8f0fb;--red:#a83030;--red-lt:#fceeed;--shadow:0 2px 4px rgba(30,25,22,.07),0 6px 18px rgba(30,25,22,.08);}
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;background:var(--bg);color:var(--text2);font-family:'Nunito',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:28px;}
.chat-shell{width:min(760px,100%);background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;}
.chat-head{padding:18px 22px;border-bottom:1px solid var(--border);background:var(--surface);}
.chat-head h1{font-size:1.2rem;color:var(--text);line-height:1.3;margin-bottom:6px;}
.chat-head p{font-size:.88rem;color:var(--text3);line-height:1.55;}
.info-row{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;}
.info-pill{display:inline-flex;gap:8px;align-items:center;padding:7px 10px;background:var(--accent-lt);border:1px solid rgba(31,95,166,.16);border-radius:8px;font-family:'Fira Code',monospace;font-size:.74rem;color:var(--accent);max-width:100%;}
.info-pill span:last-child{overflow-wrap:anywhere;}
.chat-body{height:420px;padding:20px;overflow-y:auto;background:#fbfaf8;}
.msg{max-width:82%;padding:10px 13px;border-radius:14px;margin-bottom:12px;font-size:.95rem;line-height:1.55;white-space:pre-wrap;}
.msg.bot{background:var(--surface);border:1px solid var(--border);color:var(--text2);border-top-left-radius:4px;}
.msg.user{margin-left:auto;background:var(--accent);color:#fff;border-top-right-radius:4px;}
.msg.error{background:var(--red-lt);border:1px solid rgba(168,48,48,.25);color:var(--red);}
.meta{font-family:'Fira Code',monospace;font-size:.72rem;color:var(--text3);margin-top:6px;}
.chat-form{display:flex;gap:10px;padding:16px;border-top:1px solid var(--border);background:var(--surface);}
.chat-form input{flex:1;border:1px solid var(--border);border-radius:10px;padding:12px 13px;font-family:'Nunito',system-ui,sans-serif;font-size:.95rem;color:var(--text2);outline:none;}
.chat-form input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,95,166,.12);}
.chat-form button{border:0;border-radius:10px;padding:0 18px;background:var(--accent);color:#fff;font-weight:800;font-family:'Nunito',system-ui,sans-serif;cursor:pointer;}
.chat-form button:disabled{opacity:.6;cursor:not-allowed;}
.actions{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 16px;background:var(--surface);flex-wrap:wrap;}
.actions button{border:1px solid var(--border);background:var(--bg);color:var(--text3);border-radius:8px;padding:7px 10px;font-size:.78rem;font-weight:700;cursor:pointer;}
.actions button:hover{border-color:var(--accent);color:var(--accent);}
@media(max-width:560px){body{padding:12px;}.chat-body{height:360px;}.chat-form{flex-direction:column;}.chat-form button{padding:12px;}.msg{max-width:94%;}}
</style>
</head>
<body>
<main class="chat-shell">
<section class="chat-head">
<h1>Chat da Livraria Aurora do Exercício 071</h1>
<p>Tela de teste para FAQ, produto, trava de escopo, IA e log.</p>
<div class="info-row">
<div class="info-pill"><span>api:</span><span>http://127.0.0.1:8000/chat</span></div>
<div class="info-pill"><span>user_id:</span><span id="userIdView"></span></div>
</div>
</section>
<section class="chat-body" id="chatBody">
<div class="msg bot">Olá! Teste perguntas sobre horário, entrega, produtos cadastrados ou perguntas gerais.</div>
</section>
<form class="chat-form" id="chatForm">
<input id="mensagem" type="text" placeholder="Digite sua mensagem..." autocomplete="off" />
<button id="btnEnviar" type="submit">Enviar</button>
</form>
<div class="actions">
<button type="button" data-text="Tem livro de Python?">teste rápido</button>
<button type="button" id="btnNovoId">gerar novo user_id</button>
<button type="button" id="btnLimpar">limpar conversa da tela</button>
</div>
</main>
<script>
const API_URL = "http://127.0.0.1:8000/chat";
const STORAGE_KEY = "aluno_071_user_id";
const chatBody = document.getElementById("chatBody");
const chatForm = document.getElementById("chatForm");
const inputMensagem = document.getElementById("mensagem");
const btnEnviar = document.getElementById("btnEnviar");
const btnNovoId = document.getElementById("btnNovoId");
const btnLimpar = document.getElementById("btnLimpar");
const userIdView = document.getElementById("userIdView");
function criarUserId() {
if (window.crypto && crypto.randomUUID) return "aluno_071_" + crypto.randomUUID();
return "aluno_071_" + Date.now() + "_" + Math.random().toString(16).slice(2);
}
function obterUserId() {
let userId = localStorage.getItem(STORAGE_KEY);
if (!userId) { userId = criarUserId(); localStorage.setItem(STORAGE_KEY, userId); }
return userId;
}
function atualizarUserIdNaTela() { userIdView.textContent = obterUserId(); }
function adicionarMensagem(texto, tipo, origem) {
const div = document.createElement("div");
div.className = "msg " + tipo;
div.textContent = texto;
if (origem) {
const meta = document.createElement("div");
meta.className = "meta";
meta.textContent = "origem: " + origem;
div.appendChild(meta);
}
chatBody.appendChild(div);
chatBody.scrollTop = chatBody.scrollHeight;
}
async function enviarMensagem(texto) {
const resposta = await fetch(API_URL, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ texto: texto, user_id: obterUserId() })
});
if (!resposta.ok) throw new Error("Erro ao chamar a API.");
return resposta.json();
}
chatForm.addEventListener("submit", async function(event) {
event.preventDefault();
const texto = inputMensagem.value.trim();
if (!texto) return;
adicionarMensagem(texto, "user");
inputMensagem.value = "";
btnEnviar.disabled = true;
try {
const dados = await enviarMensagem(texto);
adicionarMensagem(dados.resposta || "Sem resposta.", dados.origem === "erro" ? "bot error" : "bot", dados.origem);
} catch (erro) {
adicionarMensagem("Não foi possível conversar com a API. Confira se o servidor Python está rodando com uvicorn na porta 8000.", "bot error");
} finally {
btnEnviar.disabled = false;
inputMensagem.focus();
}
});
document.querySelectorAll("[data-text]").forEach(function(botao) {
botao.addEventListener("click", function() { inputMensagem.value = botao.dataset.text; inputMensagem.focus(); });
});
btnNovoId.addEventListener("click", function() {
const novoId = criarUserId();
localStorage.setItem(STORAGE_KEY, novoId);
atualizarUserIdNaTela();
adicionarMensagem("Novo user_id criado para este navegador.", "bot");
});
btnLimpar.addEventListener("click", function() {
chatBody.innerHTML = "";
adicionarMensagem("Conversa limpa apenas na tela.", "bot");
});
atualizarUserIdNaTela();
inputMensagem.value = "Tem livro de Python?";
inputMensagem.focus();
</script>
</body>
</html>
